---
# Baseline standard configuration, aligned to the CIS Benchmark (Level 1 - Server)
# and mapped to NIST SP 800-53 controls. See docs/compliance-mapping.md.

baseline_banner: "Authorized users only. All activity may be monitored and reported.\n"

baseline_sshd_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PermitEmptyPasswords: "no"
  HostbasedAuthentication: "no"
  IgnoreRhosts: "yes"
  X11Forwarding: "no"
  MaxAuthTries: "4"
  LoginGraceTime: "60"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "3"
  LogLevel: INFO
  Banner: /etc/issue.net

baseline_sysctl:
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.default.accept_source_route: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.conf.default.log_martians: "1"
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv4.icmp_echo_ignore_broadcasts: "1"
  net.ipv4.tcp_syncookies: "1"
  kernel.randomize_va_space: "2"

# Round two: password quality, account ageing and file integrity
baseline_pwquality:
  minlen: "14"
  minclass: "4"
  difok: "2"
  maxrepeat: "3"
  maxsequence: "3"
  dictcheck: "1"

baseline_pass_max_days: "365"
baseline_inactive_days: "30"

baseline_aide_audit_tools:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/ausearch
  - /usr/sbin/aureport
  - /usr/sbin/autrace
  - /usr/sbin/augenrules
